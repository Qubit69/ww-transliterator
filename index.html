<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Embed Metadata -->
<meta property="og:title" content="Yui&#39;s Transliterator">
<meta property="og:description" content="A tool to help decipher video game texts">
<meta property="og:url" content="https://qubit69.github.io/ww-transliterator/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Translit tool">
<meta property="og:image" content="https://qubit69.github.io/ww-transliterator/img/common/embed.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="twitter:card" content="summary_large_image">

    <title>Translit Tool</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <div class="controls">
    <div class="banner-box">Press the tiles to insert text. You can also type it in!<br>
    Tiles marked with '? ? ?' are not in the selected script</div>
        <label for="script-select">Current Script</label>
        <br>
        <select id="script-select" class="selector" title="Adjust current script">
        </select>
        <div class="btn-container">
            <button type="button" id="toggle-bg-btn" class="btn">Change BG</button>
            <button type="button" id="toggle-grid-btn" class="btn">Hide Tiles</button>
            <button type="button" id="backspace-btn" class="btn btn-danger" title="Delete Tile">
            <img src="img/common/del.svg" class="btn-icon" alt=""></button>
        </div>
    </div>

    <textarea id="output-area" class="textinput" placeholder="Text goes here..."></textarea>
    <div id="output-grid" class="output-grid"></div>
    <div id="tile-grid" class="tile-grid"></div>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
</body>
</html>
