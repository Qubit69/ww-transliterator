<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transliterator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-banner">
            <h2>Yui's Transliterator</h2>
            <a>Press the tiles to insert text. You can also type it in!
            Tiles marked with '? ? ?' are not in the selected script</a>
        </div>
    </header>
    <div class="controls">
        <label for="script-select">Current Script</label>
        <br>
        <select id="script-select">
        </select>
        <div class="toggle-container">
            <button type="button" id="bg-cycle-btn">Change BG</button>
            <button type="button" id="toggle-grid-btn">Hide Tiles</button>
            <button type="button" id="backspace-btn">🡄</button>
        </div>
    </div>

    <textarea id="output-area" placeholder="Text goes here..."></textarea>
    <div id="visual-output" class="visual-output"></div>
    <div id="image-grid" class="image-grid">
    </div>

    <footer class="site-footer">
        <div class="footer-banner">
            <div style="text-align: center;">
                <a href="https://github.com/Qubit69/ww-transliterator">Git Repo</a> | Made by <span>Yuisu</span>
                <a href="https://discord.gg/JnUd43sKSF">Solaris Archives</a> | <a href="https://github.com/Qubit69/ww-transliterator/tree/main/ref">References</a>
            </div>
            <div id="changelog" style="margin-top: 12px; text-align: left;"></div>
            <a href="https://github.com/Qubit69/ww-transliterator/commits/main/">More...</a>
        </div>
    </footer>
</body>
</html>
